<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes · Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080a0d;--panel:#0f1318;--panel2:#141a21;--panel3:#1a222c;
  --line:#1e2730;--line2:#283340;
  --text:#e8eef4;--text2:#8a98a6;--text3:#56636f;
  --live:#5df2a6;--live-dim:#1f7a52;
  --cyan:#4ed7f1;--amber:#ffb84d;--danger:#ff5c6c;--violet:#9d8cff;
  --mono:'JetBrains Mono',monospace;--body:'Inter',sans-serif;
}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── Grid overlay ── */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(78,215,238,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(78,215,238,.02) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 30%,transparent 90%)}

.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}

/* ── Topbar ── */
.topbar{display:flex;align-items:center;gap:20px;padding:0 24px;height:56px;border-bottom:1px solid var(--line);background:rgba(10,14,18,.85);backdrop-filter:blur(16px);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand .glyph{width:28px;height:28px;border:1.5px solid var(--live);border-radius:7px;display:grid;place-items:center;color:var(--live);font-size:15px;font-weight:800;box-shadow:0 0 12px rgba(93,242,166,.25) inset}
.brand b{font-size:14px;font-weight:700;letter-spacing:2px}
.brand span{color:var(--text3);font-size:14px;letter-spacing:2px;font-weight:400}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-family:var(--mono);font-size:11px;color:var(--text2)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--live);box-shadow:0 0 0 0 rgba(93,242,166,.5);animation:pulse 2s infinite}
.dot.off{background:var(--text3)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(93,242,166,.4)}70%{box-shadow:0 0 0 6px rgba(93,242,166,0)}100%{box-shadow:0 0 0 0 rgba(93,242,166,0)}}

/* ── Stat pills ── */
.stats{display:flex;gap:10px}
.stat{display:flex;flex-direction:column;align-items:center;padding:4px 14px;border:1px solid var(--line);border-radius:8px;min-width:80px}
.stat .val{font-family:var(--mono);font-size:15px;font-weight:700}
.stat .lbl{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-top:1px}
.stat .val.cyan{color:var(--cyan)}.stat .val.green{color:var(--live)}.stat .val.amber{color:var(--amber)}.stat .val.violet{color:var(--violet)}

/* ── Main layout ── */
.main{display:grid;grid-template-columns:1fr 380px;flex:1;overflow:hidden}

/* ── Sessions panel ── */
.sessions{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--line)}
.sessions-header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.sessions-header h2{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.count{font-family:var(--mono);font-size:11px;background:var(--panel3);padding:2px 8px;border-radius:6px;color:var(--cyan)}
.sessions-list{flex:1;overflow-y:auto;padding:12px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* ── Session card ── */
.scard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s;position:relative}
.scard:hover{border-color:var(--cyan);transform:translateX(2px)}
.scard.active{border-left:3px solid var(--live)}
.scard .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.scard .title{font-size:13px;font-weight:600;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .src{font-size:9px;text-transform:uppercase;letter-spacing:1px;background:var(--panel3);padding:2px 8px;border-radius:4px;color:var(--text3)}
.scard .row2{display:flex;gap:12px;font-size:11px;color:var(--text3)}
.scard .row3{display:flex;gap:14px;margin-top:6px;font-size:11px}
.scard .tok{color:var(--cyan);font-family:var(--mono)}.scard .cost{color:var(--live);font-family:var(--mono)}
.scard .model{color:var(--violet);font-family:var(--mono);font-size:10px}

/* ── Detail overlay ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}
.overlay.show{display:block}
.detail{position:fixed;right:0;top:0;bottom:0;width:520px;background:var(--panel);border-left:1px solid var(--line);z-index:51;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.detail.show{transform:translateX(0)}
.detail-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-shrink:0}
.detail-head h3{font-size:14px;font-weight:700;flex:1}
.detail-head .close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px}
.detail-info{padding:12px 20px;border-bottom:1px solid var(--line);font-size:11px;color:var(--text2);display:flex;gap:16px;flex-wrap:wrap;flex-shrink:0}
.detail-info b{color:var(--text)}
.detail-msgs{flex:1;overflow-y:auto;padding:12px 20px}
.msg{padding:8px 10px;margin-bottom:6px;border-radius:8px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--panel2);border-left:3px solid var(--cyan)}
.msg.assistant{background:rgba(93,242,166,.04);border-left:3px solid var(--live)}
.msg.tool{background:rgba(157,140,255,.04);border-left:3px solid var(--violet)}
.msg .role-tag{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:3px}

/* ── Chat panel ── */
.chat{display:flex;flex-direction:column;background:var(--panel)}
.chat-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-head h2{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text2);flex:1}
.profile-sel{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:6px;outline:none;cursor:pointer}
.profile-sel option{background:var(--panel2)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 20px}
.cmsg{margin-bottom:12px;max-width:92%}
.cmsg.sent{margin-left:auto}
.cmsg .bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cmsg.sent .bubble{background:rgba(78,215,238,.08);border:1px solid rgba(78,215,238,.15);border-bottom-right-radius:4px}
.cmsg.recv .bubble{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.cmsg .meta{font-size:9px;color:var(--text3);margin-top:3px;padding:0 4px}
.cmsg.sent .meta{text-align:right}
.cmsg.system .bubble{background:transparent;border:1px dashed var(--line);color:var(--text3);font-size:11px;text-align:center;font-style:italic}
.chat-input{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0}
.chat-input input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font-family:var(--body);font-size:13px;outline:none;transition:border-color .15s}
.chat-input input:focus{border-color:var(--cyan)}
.chat-input input::placeholder{color:var(--text3)}
.chat-input button{background:var(--cyan);color:#000;border:none;border-radius:10px;padding:10px 20px;font-family:var(--body);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.chat-input button:hover{box-shadow:0 0 20px rgba(78,215,238,.2);transform:translateY(-1px)}
.chat-input button:disabled{opacity:.3;transform:none;box-shadow:none}
.typing{display:none;padding:8px 20px;font-size:11px;color:var(--text3);font-style:italic}
.typing.show{display:block}

/* ── Responsive ── */
@media(max-width:900px){.main{grid-template-columns:1fr}.chat{display:none}.stats{display:none}}
</style>
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="brand">
      <div class="glyph">☿</div>
      <b>HERMES</b><span>CMD CENTER</span>
    </div>
    <div class="pill"><div class="dot live" id="ws-dot"></div><span id="ws-status">connecting</span></div>
    <div class="spacer"></div>
    <div class="stats">
      <div class="stat"><div class="val cyan" id="st-sessions">—</div><div class="lbl">Sessions</div></div>
      <div class="stat"><div class="val green" id="st-active">—</div><div class="lbl">Active</div></div>
      <div class="stat"><div class="val amber" id="st-tokens">—</div><div class="lbl">Tokens</div></div>
      <div class="stat"><div class="val violet" id="st-cost">—</div><div class="lbl">Cost</div></div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Sessions -->
    <div class="sessions">
      <div class="sessions-header">
        <h2>Sessions</h2>
        <div class="count" id="s-count">0</div>
      </div>
      <div class="sessions-list" id="s-list"></div>
    </div>

    <!-- Chat -->
    <div class="chat">
      <div class="chat-head">
        <h2>Chat</h2>
        <select class="profile-sel" id="chat-profile">
          <option value="">default</option>
          <option value="coder">coder</option>
          <option value="researcher">researcher</option>
          <option value="writer">writer</option>
          <option value="devops">devops</option>
          <option value="analyst">analyst</option>
        </select>
      </div>
      <div class="chat-msgs" id="chat-msgs">
        <div class="cmsg system"><div class="bubble">Send a message to any agent. Select a profile above.</div></div>
      </div>
      <div class="typing" id="typing">Agent is thinking…</div>
      <div class="chat-input">
        <input type="text" id="chat-in" placeholder="Type a message…" autocomplete="off">
        <button id="send-btn" onclick="sendChat()">Send</button>
      </div>
    </div>

  </div>
</div>

<!-- Detail overlay -->
<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail" id="detail">
  <div class="detail-head">
    <h3 id="d-title">Session</h3>
    <button class="close" onclick="closeDetail()">✕</button>
  </div>
  <div class="detail-info" id="d-info"></div>
  <div class="detail-msgs" id="d-msgs"></div>
</div>

<script>
const $=s=>document.getElementById(s);
let ws,wsOk=false,reconnectTimer;

// ── WebSocket ──────────────────────────────────────────────────────────────
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host+'/ws');
  ws.onopen=()=>{wsOk=true;$('ws-dot').className='dot live';$('ws-status').textContent='live';clearTimeout(reconnectTimer)};
  ws.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==='live_update'){renderStats(d.stats);renderSessions(d.sessions)}
      if(d.type==='full_update'){renderStats(d.stats);renderSessions(d.sessions)}
      if(d.type==='chat_response'){addChat('Hermes',d.text,'recv');$('typing').classList.remove('show');$('send-btn').disabled=false}
    }catch(x){}
  };
  ws.onerror=()=>{wsOk=false};
  ws.onclose=()=>{wsOk=false;$('ws-dot').className='dot off';$('ws-status').textContent='reconnecting';reconnectTimer=setTimeout(connect,3000)};
}
connect();

// ── Render Stats ───────────────────────────────────────────────────────────
function renderStats(s){
  if(!s)return;
  $('st-sessions').textContent=fmt(s.total_sessions);
  $('st-active').textContent=fmt(s.active_sessions);
  const tok=(s.total_input_tokens||0)+(s.total_output_tokens||0)+(s.total_cache_tokens||0);
  $('st-tokens').textContent=fmt(tok);
  $('st-cost').textContent='$'+(s.total_cost||0).toFixed(2);
}

// ── Render Sessions ────────────────────────────────────────────────────────
function renderSessions(sessions){
  if(!sessions)return;
  $('s-count').textContent=sessions.length;
  $('s-list').innerHTML=sessions.map(s=>
    '<div class="scard'+(s.is_active?' active':'')+'" onclick="openDetail(\''+s.id+'\')">' +
      '<div class="row1"><div class="title">'+esc(s.title||s.id)+'</div><div class="src">'+esc(s.source||'—')+'</div></div>' +
      '<div class="row2"><span class="model">'+esc(s.model||'—')+'</span><span>'+esc(s.started_human)+'</span><span>'+(s.message_count||0)+' msgs</span></div>' +
      '<div class="row3"><span class="tok">'+fmt(s.total_tokens)+' tok</span><span class="cost">$'+(s.estimated_cost_usd||0).toFixed(4)+'</span></div>' +
    '</div>'
  ).join('');
}

// ── Session Detail ─────────────────────────────────────────────────────────
async function openDetail(sid){
  $('overlay').classList.add('show');$('detail').classList.add('show');
  $('d-title').textContent=sid; $('d-msgs').innerHTML='<div style="color:var(--text3);padding:20px">Loading…</div>';
  try{
    const[sRes,mRes]=await Promise.all([fetch('/api/sessions?limit=999'),fetch('/api/sessions/'+sid+'/messages?limit=200')]);
    const sData=await sRes.json();const mData=await mRes.json();
    const session=(sData.sessions||[]).find(x=>x.id===sid)||{};
    $('d-title').textContent=session.title||sid;
    $('d-info').innerHTML='<b>Model:</b> '+esc(session.model||'—')+' <b>Source:</b> '+esc(session.source||'—')+
      ' <b>Msgs:</b> '+(session.message_count||0)+' <b>Tokens:</b> '+fmt(session.total_tokens)+
      ' <b>Cost:</b> $'+(session.estimated_cost_usd||0).toFixed(4);
    $('d-msgs').innerHTML=(mData.messages||[]).map(m=>
      '<div class="msg '+m.role+'"><div class="role-tag">'+esc(m.role)+(m.tool_name?' · '+esc(m.tool_name):'')+' <span style="float:right">'+esc(m.time)+'</span></div>'+esc(m.content||'')+'</div>'
    ).join('');
  }catch(e){$('d-msgs').innerHTML='<div style="color:var(--danger)">'+e+'</div>'}
}
function closeDetail(){$('overlay').classList.remove('show');$('detail').classList.remove('show')}

// ── Chat ───────────────────────────────────────────────────────────────────
function sendChat(){
  const input=$('chat-in');const text=input.value.trim();if(!text)return;
  const profile=$('chat-profile').value;
  addChat('You',text,'sent');input.value='';
  $('send-btn').disabled=true;$('typing').classList.add('show');
  if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify({type:'chat',text,profile}))}
  else{addChat('System','Not connected','recv');$('send-btn').disabled=false;$('typing').classList.remove('show')}
}
function addChat(sender,text,cls){
  const div=document.createElement('div');div.className='cmsg '+cls;
  const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  div.innerHTML='<div class="bubble">'+esc(text)+'</div><div class="meta">'+esc(sender)+' · '+now+'</div>';
  $('chat-msgs').appendChild(div);$('chat-msgs').scrollTop=$('chat-msgs').scrollHeight;
}
$('chat-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});

// ── Utils ──────────────────────────────────────────────────────────────────
function fmt(n){if(n==null)return'0';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

// ── Init ───────────────────────────────────────────────────────────────────
(async()=>{
  try{
    const[r1,r2]=await Promise.all([fetch('/api/stats'),fetch('/api/sessions?limit=50')]);
    const stats=await r1.json();const sess=await r2.json();
    renderStats(stats.stats);renderSessions(sess.sessions);
  }catch(e){console.error('init fail',e)}
})();
</script>
</body>
</html>
